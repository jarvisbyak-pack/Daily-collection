<section class="tab-view active" id="tab-collection">
      <div class="card">
        <h2>Today · <span id="collection-date"></span></h2>
        <div class="stat-grid">
          <div class="stat"><div class="num" id="stat-clients">0</div><div class="label">Clients paid</div></div>
          <div class="stat"><div class="num" id="stat-total">₹0</div><div class="label">Total collection</div></div>
          <div class="stat"><div class="num" id="stat-cash">₹0</div><div class="label">Cash</div></div>
          <div class="stat"><div class="num" id="stat-upi">₹0</div><div class="label">UPI</div></div>
          <div class="stat"><div class="num" id="stat-prev">₹0</div><div class="label">Previous day cash</div></div>
          <div class="stat"><div class="num" id="stat-closing">₹0</div><div class="label">Closing cash</div></div>
        </div>
        <div id="day-status-badge" style="margin-top:10px;"></div>
        <button class="btn" id="open-add-payment">+ Add payment</button>
        <button class="btn secondary" id="open-close-day">Close today's collection</button>
      </div>
      <div class="card">
        <h2>Today's payments</h2>
        <div id="today-payments-list"></div>
      </div>
    </section>
