<!-- ================= LOGIN ================= -->
<div id="login-screen">
  <div class="login-card">
    <div class="brand">
      <img class="brand-wordmark" src="./assets/ak-pack-wordmark.png" alt="AK PACK FITNESS">
      <div class="brand-name hidden" id="login-brand-name">AK Pack Fitness</div>
      <div class="brand-sub">Staff sign in</div>
    </div>
    <form id="login-form">
      <label>Username</label>
      <input type="text" id="login-username" autocomplete="username" required>
      <label>PIN</label>
      <input type="password" id="login-pin" inputmode="numeric" autocomplete="current-password" required>
      <div class="error-msg" id="login-error"></div>
      <button class="btn" type="submit" id="login-btn">Sign in</button>
    </form>
  </div>
</div>

<!-- ================= APP ================= -->
