<section class="tab-view" id="tab-details">
      <div class="card">
        <h2>Reception cash balance</h2>
        <div class="stat-grid">
          <div class="stat"><div class="num" id="cash-handover-start">₹0</div><div class="label">Cash before handovers</div></div>
          <div class="stat"><div class="num" id="cash-handover-balance">₹0</div><div class="label">Cash remaining at reception</div></div>
        </div>
        <p class="row-sub" style="margin-top:10px;">Record cash given to or received from any person. Each movement is listed separately and updates the reception balance.</p>
        <button class="btn" id="open-cash-handover">+ Record cash handover</button>
        <div id="cash-handover-list" style="margin-top:10px;"><div class="empty">Loading cash movements…</div></div>
      </div>
      <div class="card">
        <div class="section-head"><h2>Collection details</h2></div>
        <label>Date</label>
        <input type="date" id="details-date-filter">
        <div class="stat-grid" id="details-summary" style="margin-top:10px;"></div>
        <div id="details-list" style="margin-top:10px;"></div>
      </div>
    </section>
